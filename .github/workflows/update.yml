name: Update Forecast Data

on:
  schedule:
    # 毎日 日本時間 06:00 (UTC 21:00) と 18:00 (UTC 09:00)
    - cron: "0 21,9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "update_forecast.py"
      - "data/spots.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build forecast
        run: python update_forecast.py

      - name: Commit forecast files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/forecast.js
          if git diff --staged --quiet; then
            echo "No forecast changes"
          else
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Auto update forecast data [skip ci]"
            git push
          fi
