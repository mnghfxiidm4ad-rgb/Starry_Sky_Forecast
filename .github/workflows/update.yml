name: Update Forecast Data

on:
  schedule:
    # 毎日 日本時間 06:00 (UTC 21:00) と 18:00 (UTC 09:00) の1日2回自動実行
    - cron: '0 21,9 * * *'
  workflow_dispatch: # 手動実行ボタンを表示する設定

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 予報データの計算と更新
        run: |
          python update_forecast.py

      - name: forecast.json を自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update forecast data [skip ci]" && git push)
